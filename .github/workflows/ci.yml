name: CI

# 日常校验：类型检查 + 前端构建。
# 刻意用 windows-latest 而不是 ubuntu：锁文件是在 Windows 上生成的，
# @rollup/rollup-* / esbuild 这类 optional 依赖按平台分发，换平台容易踩
# 「找不到 linux-x64-gnu 二进制」的坑，而本项目本来就只面向 Windows。
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".gitignore"
      - ".gitattributes"
  pull_request:
    branches: [main]
  workflow_dispatch:

# action 版本：checkout / setup-node 要 v5+、pnpm/action-setup 要 v5+ 才跑在 node24 上。
# 停在 v4 会收到 "Node.js 20 is deprecated" 警告（并被强制改跑 node24），
# 所以这里统一钉在已迁到 node24 的主版本，别往下退。
#
# 同一个分支连续推送时，取消还没跑完的旧任务
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: 类型检查与前端构建
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm type-check

      - name: 构建前端
        run: pnpm build
