[package]
name = "temporary-recorder"
version = "0.1.0"
description = "闪记 —— 轻量级临时记录器"
authors = ["helay"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "temporary_recorder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 关闭 WebView2 的浏览器加速键需要直接使用 WebView2 的 COM 接口。
# 版本必须与 tauri 依赖树内的保持一致（见 Cargo.lock：
# webview2-com 0.38.2 / windows-core 0.61.2），否则 ICoreWebView2* 类型
# 与 tauri 暴露的 controller() 不是同一个类型，编译不过。
# 这也正是把 tauri 固定到次版本 2.11 的原因：tauri 官方文档明确提示
# webview2-com 可能随 tauri 的次版本更新而变化。
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows-core = "0.61"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
